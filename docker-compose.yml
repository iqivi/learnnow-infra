version: '3.9'

services:

  nginx:
    image: nginx:1.25.3-alpine
    container_name: dev_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/conf/devops.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend

  backend:
    build:
      context: ../backend
    container_name: dev_backend
    restart: unless-stopped

  frontend:
    build:
      context: ../web-app
    container_name: dev_frontend
    restart: unless-stopped

  # ============================================
  # 6) MYSQL DATABASE
  # ============================================
  mysql:
    image: mysql:8.0
    container_name: mysql_db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: appdb
      MYSQL_USER: appuser
      MYSQL_PASSWORD: apppass
    ports:
      - "3306:3306"
    volumes:
      - ../db:/var/lib/mysql
    restart: always
