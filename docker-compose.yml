version: '3.9'

services:

  nginx:
    image: nginx:1.25.3-alpine
    container_name: nginx
    ports:
      - "8099:80"
    volumes:
      - ./nginx/conf/devops.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend

  backend:
    build:
      context: ../backend
    container_name: backend
    environment:
      - DB_HOST=mysql
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - MAIL_USERNAME=${MAIL_USERNAME}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
      - MYSQL_PORT=3306
    ports:
      - "${BACKEND_EXTERNAL_PORT}:8080"
    depends_on:
      - mysql
    restart: unless-stopped

  frontend:
    build:
      context: ../web-app
      args:
        VITE_API_URL: http://localhost:${BACKEND_EXTERNAL_PORT}/api
    container_name: frontend
    restart: unless-stopped

  # ============================================
  # 6) MYSQL DATABASE
  # ============================================
  mysql:
    image: mysql:8.0
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${MYSQL_EXTERNAL_PORT}:3306"
    volumes:
      - mysql_data:/var/lib/mysql # Best Practice Volume
      - ../db/init:/docker-entrypoint-initdb.d
    restart: always


volumes:
  mysql_data:
