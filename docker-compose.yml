version: '3.9'

services:

  # ============================================
  # 1) NGINX REVERSE PROXY
  # ============================================
  nginx:
    image: nginx:1.25.3-alpine
    container_name: nginx
    volumes:
      - ./nginx/conf/devops.conf:/etc/nginx/conf.d/default.conf

      # certbot
      - ./nginx/certbot/conf:/etc/letsencrypt
      - ./nginx/certbot/www:/var/www/certbot

      # auth (opcjonalne — stwórz folder!)
      - ./nginx/auth/.htpasswd:/etc/nginx/auth/.htpasswd:ro
    ports:
      - "80:80"
      - "443:443"
    restart: always
    depends_on:
      - jenkins
      - frontend
      - backend

  # ============================================
  # 2) JENKINS
  # ============================================
  jenkins:
    image: jenkins/jenkins:lts-jdk17
    container_name: ci_jenkins
    privileged: true
    user: root
    environment:
      - JENKINS_OPTS=$JENKINS_OPTS
    volumes:
      - ./jenkins/jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - ..:/workspace        # <-- cały projekt dostępny w Jenkinsie
    restart: always

  # ============================================
  # 3) FRONTEND (React → Nginx build)
  # ============================================
  frontend:
    build:
      context: ../web-app
      dockerfile: Dockerfile
      args:
        VITE_API_URL: "https://learnnow.ovh/api"
    container_name: main_frontend
    volumes:
      - ../web-app/nginx/conf/react.conf:/etc/nginx/conf.d/default.conf:ro
    restart: always

  # ============================================
  # 4) CERTBOT
  # ============================================
  certbot:
    image: certbot/certbot
    container_name: certbot
    volumes:
      - ./nginx/certbot/conf:/etc/letsencrypt
      - ./nginx/certbot/www:/var/www/certbot
    # Zmieniona komenda, aby zażądać ODDZIELNYCH certyfikatów
    command: >
      certonly --webroot -w /var/www/certbot
      --force-renewal
      -d learnnow.ovh
      --cert-name learnnow.ovh
      -d jenkins.learnnow.ovh
      --cert-name jenkins.learnnow.ovh
      --email igor96mail@gmail.com
      --rsa-key-size 4096
      --agree-tos
      --noninteractive
      --expand

  # ============================================
  # 6) MYSQL DATABASE
  # ============================================
  mysql:
    image: mysql:8.0
    container_name: mysql_db
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql_prod_data:/var/lib/mysql
      - ../db/init:/docker-entrypoint-initdb.d
    restart: always
    
  # ============================================
  # 5) BACKEND (Spring Boot)
  # ============================================
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: spring_backend
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - DB_HOST=mysql
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - MYSQL_PORT=3306
      - JWT_SECRET=${JWT_SECRET}
      - MAIL_USERNAME=${MAIL_USERNAME}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
      - APP_BACKEND_LINK=https://learnnow.ovh/
      - APP_FRONTEND_LINK=https://learnnow.ovh/
    ports:
      - "8081:8080"
    restart: always

volumes:
  mysql_prod_data:

networks:
  default:
    driver: bridge
