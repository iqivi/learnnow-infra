version: '3.9'

services:

  nginx:
    image: nginx:1.25.3-alpine
    container_name: dev_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/conf/devops.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend

  backend:
    build:
      context: ../backend
    container_name: dev_backend
    restart: unless-stopped

  frontend:
    build:
      context: ../web-app
    container_name: dev_frontend
    restart: unless-stopped

  # ============================================
  # 6) MYSQL DATABASE
  # ============================================
  mysql:
    image: mysql:8.0
    container_name: mysql_db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: appdb
      MYSQL_USER: appuser
      MYSQL_PASSWORD: apppass
    ports:
      - "3307:3306" # <-- CHANGED: Host port 3307 maps to Container port 3306
    volumes:
      - mysql_data:/var/lib/mysql # Best Practice Volume
      - ../db/init:/docker-entrypoint-initdb.d
    restart: always


volumes:
  mysql_data:
