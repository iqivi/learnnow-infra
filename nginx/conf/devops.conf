# Konfiguracja bazowa
include /etc/nginx/mime.types;
server_tokens off; # Ukrywa wersję Nginx


# ==================================================================
# SEKCJA HTTP (PORT 80)
# ==================================================================

# ------------------------------------------------------------------
# WIRTUALNY HOST 1: WALIDACJA CERTBOTA I REDIRECT DLA learnnow.ovh
# ------------------------------------------------------------------
server {
    listen 80;
    server_name learnnow.ovh; # Tylko domena, którą chcemy przekierować na HTTPS

    # 1. NAJWYŻSZY PRIORYTET: Obsługa plików walidacyjnych Certbot
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        access_log off;
        allow all;
    }

    # 2. CAŁY RESZTA RUCHU: Stałe przekierowanie na HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ------------------------------------------------------------------
# WIRTUALNY HOST 2: JENKINS (HTTP)
# ------------------------------------------------------------------
server {
    listen 80;
    server_name jenkins.learnnow.ovh; # Tylko Jenkins

    # Proxy dla Jenkinsa (na HTTP)
    location / {
        proxy_pass http://jenkins:8080;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http; 

        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 80; 

        proxy_redirect off;
    }
}


# ==================================================================
# SEKCJA HTTPS (PORT 443) - TYLKO DLA learnnow.ovh
# ==================================================================

# ------------------------------------------------------------------
# WIRTUALNY HOST 1: STRONA GŁÓWNA (learnnow.ovh) - HTTPS (443)
# ------------------------------------------------------------------
server {
    listen 443 ssl http2;
    server_name learnnow.ovh;
    
    # Wymagane parametry SSL
    ssl_certificate /etc/letsencrypt/live/learnnow.ovh/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/learnnow.ovh/privkey.pem;
    ssl_ecdh_curve secp384r1;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305';
    ssl_prefer_server_ciphers on;
    
    # HSTS jest kluczowe dla SSL
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    location / {
        proxy_pass http://frontend:80;
        
        proxy_set_header X-Forwarded-Proto https; # Ważne dla proxy SSL
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ==========================================
    # BACKEND API PROXY
    # learnnow.ovh/api → spring_backend:8080
    # ==========================================
    location /api/ {
        proxy_pass http://spring_backend:8080/;

        # standard reverse-proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # allow big JSON bodies etc.
        client_max_body_size 10M;

        # prevent Nginx from messing with paths
        proxy_redirect off;
    }
}