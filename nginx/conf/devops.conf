# Konfiguracja bazowa
include /etc/nginx/mime.types;
server_tokens off; # Ukrywa wersję Nginx

# ==================================================================
# SEKCJA HTTP (PORT 80) - PRZEKIEROWANIA + CERTBOT
# ==================================================================

# ------------------------------------------------------------------
# WIRTUALNY HOST: DOMENY Z PRZEKIEROWANIEM NA HTTPS (learnnow, jenkins)
# ------------------------------------------------------------------
server {
    listen 80;
    server_name learnnow.ovh jenkins.learnnow.ovh;

    # Obsługa plików walidacyjnych Certbot (MUSI ZOSTAĆ)
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        access_log off;
        allow all;
    }

    # Przekierowanie całego pozostałego ruchu na HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ------------------------------------------------------------------
# WIRTUALNY HOST: GERRIT (gerrit.learnnow.ovh) - HTTP (80)
# Ponieważ Gerrit działa za HTTPS PROXY, musi mieć oddzielny blok HTTP.
# ------------------------------------------------------------------
server {
    listen 80;
    server_name gerrit.learnnow.ovh; 

    # Obsługa plików walidacyjnych Certbot (MUSI ZOSTAĆ)
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        access_log off;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}


# ==================================================================
# SEKCJA HTTPS (PORT 443)
# Używamy ogólnych dyrektyw ssl_certificate i ssl_certificate_key
# ==================================================================

# ------------------------------------------------------------------
# WIRTUALNY HOST 1: STRONA GŁÓWNA (learnnow.ovh) - HTTPS (443)
# ------------------------------------------------------------------
server {
    listen 443 ssl http2;
    server_name learnnow.ovh;
    # Wymagane parametry SSL (warto je dodać globalnie)
    ssl_certificate /etc/letsencrypt/live/learnnow.ovh/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/learnnow.ovh/privkey.pem;
    ssl_ecdh_curve secp384r1;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305';
    ssl_prefer_server_ciphers on;
    
    # HSTS jest kluczowe dla SSL
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    location / {
        proxy_pass http://frontend:80;
        
        proxy_set_header X-Forwarded-Proto https; # Ważne dla proxy SSL
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ==========================================
    # BACKEND API PROXY
    # learnnow.ovh/api → spring_backend:8080
    # ==========================================
    location /api/ {
        proxy_pass http://spring_backend:8080/;

        # standard reverse-proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # allow big JSON bodies etc.
        client_max_body_size 10M;

        # prevent Nginx from messing with paths
        proxy_redirect off;
    }
}

# ------------------------------------------------------------------
# WIRTUALNY HOST 2: JENKINS (jenkins.learnnow.ovh) - HTTPS (443)
# ------------------------------------------------------------------
server {
    listen 443 ssl http2;
    server_name jenkins.learnnow.ovh;

    ssl_certificate /etc/letsencrypt/live/learnnow.ovh/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/learnnow.ovh/privkey.pem;
    ssl_ecdh_curve secp384r1;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305';
    ssl_prefer_server_ciphers on;
    
    # HSTS jest kluczowe dla SSL
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    location / {

        proxy_pass http://jenkins:8080;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # Te dwie linie są kluczowe przy Jenkinsie za reverse proxy:
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;

        proxy_redirect off;
    }
}
